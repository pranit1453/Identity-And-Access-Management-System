spring:
  # Application Name
  application:
    name: access-hub
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: 140503
    driver-class-name: org.postgresql.Driver
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  refreshToken:
    expiration: 604800
  token:
    issuer: access-hub
  cookie:
    name:
      refreshTokenName: refreshToken
      accessTokenName: accessToken
    cookieHttpOnly: true
    cookieSecure: false
    cookieSameSite: lax
    cookieDomain: localhost
# Logging Configuration
logging:
  file:
    name: logs/access-hub.log
  level:
    root: INFO
    com.pranit.accesshub: DEBUG
# Keys Configuration
keys:
  privateKeyPath: key/private_key.pem
  publicKeyPath: key/public_key.pem
# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# SEED Configuration
access-hub:
  credential:
    username: access-hub
    password: Access-Hub@14

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: access-hub
    description: "This is an Authentication Service"
    version: "1.0.0"