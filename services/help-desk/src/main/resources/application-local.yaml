spring:
  # Application Name
  application:
    name: help-desk
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/ai
    username: postgres
    password: 140503
    driver-class-name: org.postgresql.Driver
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Oauth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:key/public_key.pem
  # AI Configuration
  ai:
    chat:
      client:
        enabled: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${API_KEY}
      base-url: https://integrate.api.nvidia.com/v1
      chat:
        model: nvidia/nemotron-3-ultra-550b-a55b
        temperature: 0.7
        max-tokens: 1000
# Logging Configuration
logging:
  file:
    name: logs/access-hub.log
  level:
    root: INFO
    com.pranit.accesshub: DEBUG
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: access-hub
    description: "This is a help desk agent"
    version: "1.0.0"

# Client URL
access-hub:
  base-url: ${PORTAL_URL}
  api-version: ${API_VERSION}